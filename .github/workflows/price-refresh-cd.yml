# 가격 갱신 크롤러 prod CD (main 브랜치 → V3 Prod 이미지 승격, V2는 조건부 유지)
# - 크롤러는 ECS Service가 아니다. EventBridge Scheduler가 family ARN으로 최신 ACTIVE revision을
#   RunTask한다 (수집 --apply 매일 11:00, 전송 --deliver 5분마다). 그래서 배포 = revision 등록이다.
# - Task Definition은 CLOUD 레포 Terraform이 S3 템플릿(prod/v2/crawler.json)으로 관리한다.
#   이 워크플로는 템플릿의 __DIGEST__만 이번 이미지 digest로 바꿔 등록한다.
# - 이미지 태그는 커밋 SHA 7자리. ECR이 IMMUTABLE이라 같은 태그는 덮어쓰지 못하고 push가 실패한다.
# - GitHub Environment "production" 변수: CRAWLER_BUILD_ROLE_ARN, CRAWLER_DEPLOY_ROLE_ARN
#   (production Environment의 Deployment branches를 main으로 제한해야 한다)
name: Price refresh CD

run-name: >-
  ${{ github.event_name == 'push'
      && format('Price refresh prod V3 image promotion - {0}', github.sha)
      || format('Price refresh V2 rollback - {0}', inputs.image_tag) }}

on:
  # main이 갱신되면 자동 배포 (develop→main 머지, hotfix→main 머지 모두 포함)
  push:
    branches: ["main"]

  # 이미 ECR에 있는 이미지로 revision을 다시 등록할 때(롤백) 사용한다.
  workflow_dispatch:
    inputs:
      image_tag:
        description: "등록할 ECR 이미지 태그(7자리 SHA)"
        required: true
        type: string
      reason:
        description: "사유"
        required: true
        type: string

permissions: {}

concurrency:
  group: lookddak-price-refresh-production
  cancel-in-progress: false

env:
  AWS_REGION: ap-northeast-2
  ECR_REPOSITORY: lookddak-crawler
  TASK_FAMILY: lookddak-prod-v2-crawler
  TEMPLATE_KEY: prod/v2/crawler.json
  BUILD_CONTEXT: price-refresh-crawler

jobs:
  # V2가 다시 활성화될 때만 Prod 전용 이미지를 빌드한다. 평상시 V3 승격은 Dev 이미지를 재사용한다.
  build-and-push:
    name: prod-build
    if: ${{ github.event_name == 'push' && vars.V2_PROD_DEPLOY_ENABLED == 'true' }}
    # Task Definition이 ARM64(Graviton)라 ARM 러너에서 네이티브로 빌드한다.
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    environment: production
    permissions:
      id-token: write
      contents: read
    outputs:
      tag: ${{ steps.vars.outputs.tag }}
    steps:
      - name: Guard - main 브랜치 확인
        if: ${{ github.ref != 'refs/heads/main' }}
        run: |
          echo "main 브랜치만 운영에 배포할 수 있습니다. 현재 ref: ${GITHUB_REF}"
          exit 1

      - name: Checkout
        uses: actions/checkout@v4

      - name: 이미지 태그 결정
        id: vars
        run: echo "tag=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: AWS 인증 - build role
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.CRAWLER_BUILD_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: ECR 로그인
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Buildx 준비
        uses: docker/setup-buildx-action@v3

      # Dockerfile의 test 단계가 단위 테스트를 실행한다. 실패하면 push되지 않는다.
      - name: 빌드 및 ECR push
        uses: docker/build-push-action@v6
        with:
          context: ${{ env.BUILD_CONTEXT }}
          file: ${{ env.BUILD_CONTEXT }}/Dockerfile
          platforms: linux/arm64
          push: true
          provenance: false
          tags: ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ steps.vars.outputs.tag }}
          cache-from: type=gha,scope=price-refresh
          cache-to: type=gha,mode=max,scope=price-refresh

  # V2 prod(ECS) 배포 동결 (2026-11-08): V3(EKS) 전환 준비 중 V2 prod 배포를 멈춘다 (서비스 중인 Task는 유지).
  # 저장소 변수 V2_PROD_DEPLOY_ENABLED를 두지 않으므로 skipped. 긴급 배포·롤백이 필요하면 변수를 'true'로 만들면 PR 없이 다시 켜진다.
  register:
    name: prod-register
    needs: build-and-push
    if: >-
      ${{
        always() &&
        vars.V2_PROD_DEPLOY_ENABLED == 'true' &&
        (
          (github.event_name == 'push' && needs.build-and-push.result == 'success') ||
          github.event_name == 'workflow_dispatch'
        )
      }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: production
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Guard - main 브랜치 확인
        if: ${{ github.ref != 'refs/heads/main' }}
        run: |
          echo "main 브랜치의 워크플로만 운영에 배포할 수 있습니다. 현재 ref: ${GITHUB_REF}"
          exit 1

      - name: 태그와 사유 확정
        id: meta
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_TAG: ${{ inputs.image_tag }}
          INPUT_REASON: ${{ inputs.reason }}
          BUILT_TAG: ${{ needs.build-and-push.outputs.tag }}
        run: |
          if [[ "$EVENT_NAME" == "push" ]]; then
            TAG="$BUILT_TAG"
            REASON="main push by ${GITHUB_ACTOR}"
          else
            TAG="$INPUT_TAG"
            REASON="$INPUT_REASON"
          fi
          if [[ ! "$TAG" =~ ^[0-9a-f]{7}$ ]]; then
            echo "태그 형식이 잘못되었습니다: '$TAG'"
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          {
            echo "reason<<__EOF__"
            echo "$REASON"
            echo "__EOF__"
          } >> "$GITHUB_OUTPUT"

      - name: AWS 인증 - deploy role
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.CRAWLER_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: 이미지 digest 조회
        id: image
        env:
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          DIGEST=$(aws ecr describe-images \
            --repository-name "$ECR_REPOSITORY" \
            --image-ids imageTag="$TAG" \
            --query 'imageDetails[0].imageDigest' --output text) \
          || { echo "ECR에 ${ECR_REPOSITORY}:${TAG} 이미지가 없습니다."; exit 1; }
          if [[ ! "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "digest 형식이 잘못되었습니다: '$DIGEST'"
            exit 1
          fi
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"

      # 버킷 이름에 계정 ID가 들어가므로 레포에 적지 않고 실행 시 만든다.
      - name: Task Definition 템플릿 다운로드
        id: template
        run: |
          ACCOUNT=$(aws sts get-caller-identity --query Account --output text)
          BUCKET="lookddak-ecs-taskdef-${ACCOUNT}-${AWS_REGION}"
          VERSION=$(aws s3api get-object \
            --bucket "$BUCKET" --key "$TEMPLATE_KEY" \
            "$RUNNER_TEMP/template.json" \
            --query VersionId --output text)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "repository_uri=${ACCOUNT}.dkr.ecr.${AWS_REGION}.amazonaws.com/${ECR_REPOSITORY}" >> "$GITHUB_OUTPUT"

      # __DIGEST__만 바꾸고, family·컨테이너 수·이미지 저장소가 예상과 같은지 확인한다.
      - name: digest 치환 및 검증
        env:
          DIGEST: ${{ steps.image.outputs.digest }}
          REPOSITORY_URI: ${{ steps.template.outputs.repository_uri }}
        run: |
          TEMPLATE="$RUNNER_TEMP/template.json"
          TASKDEF="$RUNNER_TEMP/taskdef.json"

          jq -e --arg family "$TASK_FAMILY" --arg image "${REPOSITORY_URI}@__DIGEST__" '
            .family == $family and
            (.containerDefinitions | length) == 1 and
            .containerDefinitions[0].image == $image
          ' "$TEMPLATE" > /dev/null \
          || { echo "::error::템플릿이 예상과 다릅니다 (family, 컨테이너 수, image 확인)"; exit 1; }

          jq --arg digest "$DIGEST" \
            '.containerDefinitions[0].image |= sub("@__DIGEST__$"; "@" + $digest)' \
            "$TEMPLATE" > "$TASKDEF"

          if grep -q '__DIGEST__' "$TASKDEF"; then
            echo "::error::치환 후에도 __DIGEST__가 남아 있습니다."
            exit 1
          fi
          jq -e --arg image "${REPOSITORY_URI}@${DIGEST}" \
            '.containerDefinitions[0].image == $image' "$TASKDEF" > /dev/null \
          || { echo "::error::치환 결과 image가 예상과 다릅니다."; exit 1; }

      # 등록만 한다. Scheduler가 다음 실행부터 이 revision(최신 ACTIVE)을 쓴다.
      - name: revision 등록
        id: register
        run: |
          ARN=$(aws ecs register-task-definition \
            --cli-input-json "file://$RUNNER_TEMP/taskdef.json" \
            --query 'taskDefinition.taskDefinitionArn' --output text)
          echo "arn=$ARN" >> "$GITHUB_OUTPUT"
          echo "등록: $ARN"

      # 실제로 실행될 revision(family의 최신 ACTIVE)이 방금 등록한 것이고 이미지가 이번 digest인지 확인한다.
      - name: 등록 결과 확인
        env:
          TAG: ${{ steps.meta.outputs.tag }}
          REASON: ${{ steps.meta.outputs.reason }}
          DIGEST: ${{ steps.image.outputs.digest }}
          REQUESTED: ${{ steps.register.outputs.arn }}
          TEMPLATE_VERSION: ${{ steps.template.outputs.version }}
        run: |
          read -r LATEST IMAGE STATUS < <(aws ecs describe-task-definition \
            --task-definition "$TASK_FAMILY" \
            --query 'taskDefinition.[taskDefinitionArn,containerDefinitions[0].image,status]' \
            --output text)
          {
            echo "### 가격 갱신 크롤러 prod revision 등록"
            echo "- 태그: \`${TAG}\` / 사유: ${REASON}"
            echo "- digest: \`${DIGEST}\`"
            echo "- 템플릿: \`${TEMPLATE_KEY}\` (S3 버전 \`${TEMPLATE_VERSION}\`)"
            echo "- 등록 revision: \`${REQUESTED}\`"
            echo "- 최신 ACTIVE: \`${LATEST}\` (${STATUS})"
          } >> "$GITHUB_STEP_SUMMARY"
          if [[ "$LATEST" != "$REQUESTED" || "$STATUS" != "ACTIVE" || "$IMAGE" != *"@${DIGEST}" ]]; then
            echo "::error::최신 ACTIVE revision이 방금 등록한 revision과 다릅니다."
            exit 1
          fi
          echo "다음 Scheduler 실행부터 ${REQUESTED##*/} 사용"

  # V3 Prod(EKS)는 main에서 재빌드하지 않고 해당 Release에 포함된 Dev 검증 Digest를 승격한다.
  # V2가 재활성화돼도 이 Job은 build-and-push와 의존성이 없어 병렬로 실행된다.
  publish-v3-prod:
    name: publish-v3-prod
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: production
    permissions:
      actions: read
      contents: read
      pull-requests: read
    steps:
      - name: 승격 대상 Dev Commit 확인
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
          MCrawlerN_SHA: ${{ github.sha }}
          REPOSITORY: ${{ github.repository }}
        run: |
          DEV_SHA=$(gh api "repos/$REPOSITORY/commits/$MCrawlerN_SHA/pulls" \
            --jq '[.[] | select(.base.ref == "main")][0].head.sha // empty')
          if [[ -z "$DEV_SHA" ]]; then DEV_SHA="$MCrawlerN_SHA"; fi
          if [[ ! "$DEV_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::승격 대상 Dev commit SHA를 확인할 수 없습니다: '$DEV_SHA'"
            exit 1
          fi
          echo "dev_sha=$DEV_SHA" >> "$GITHUB_OUTPUT"

      - name: 성공한 Dev CD 실행 확인
        id: dev-run
        env:
          GH_TOKEN: ${{ github.token }}
          DEV_SHA: ${{ steps.source.outputs.dev_sha }}
          REPOSITORY: ${{ github.repository }}
        run: |
          RUN_ID=$(gh api --method GET \
            "repos/$REPOSITORY/actions/workflows/price-refresh-dev-cd.yml/runs" \
            -f head_sha="$DEV_SHA" -f status="success" -f event="push" -f per_page="10" \
            --jq '.workflow_runs[0].id // empty')
          if [[ -z "$RUN_ID" ]]; then
            echo "::error::$DEV_SHA 이미지가 성공한 Crawler dev CD에서 검증된 기록이 없습니다."
            exit 1
          fi
          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"
          echo "run_url=https://github.com/$REPOSITORY/actions/runs/$RUN_ID" >> "$GITHUB_OUTPUT"

      - name: Dev 이미지 승격 증빙 다운로드
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ steps.dev-run.outputs.run_id }}
          DEV_SHA: ${{ steps.source.outputs.dev_sha }}
        run: |
          gh run download "$RUN_ID" --repo "$GITHUB_REPOSITORY" \
            --name "crawler-dev-image-$DEV_SHA" --dir "$RUNNER_TEMP/dev-image"

      - name: Dev 이미지 승격 증빙 검증
        id: image
        env:
          DEV_SHA: ${{ steps.source.outputs.dev_sha }}
        run: |
          PROVENANCE="$RUNNER_TEMP/dev-image/crawler-dev-image.json"
          test -s "$PROVENANCE" || { echo "::error::Dev 이미지 증빙 파일이 없습니다."; exit 1; }
          RECORDED_SHA=$(jq -er '.source_sha' "$PROVENANCE")
          DIGEST=$(jq -er '.digest' "$PROVENANCE")
          if [[ "$RECORDED_SHA" != "$DEV_SHA" ]]; then
            echo "::error::증빙 Commit이 승격 대상과 다릅니다: expected=$DEV_SHA actual=$RECORDED_SHA"
            exit 1
          fi
          if [[ ! "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::증빙 digest 형식이 잘못되었습니다: '$DIGEST'"
            exit 1
          fi
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"

      - name: GitOps GitHub App Token 발급
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.DEV_IMAGE_BOT_CLIENT_ID }}
          private-key: ${{ secrets.DEV_IMAGE_BOT_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: KTB4-15th-GITOPS
          permission-contents: write

      - name: GitOps Prod 이미지 승격 요청
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          DIGEST: ${{ steps.image.outputs.digest }}
          DEV_SHA: ${{ steps.source.outputs.dev_sha }}
          DEV_RUN_URL: ${{ steps.dev-run.outputs.run_url }}
          SOURCE_REPOSITORY: ${{ github.repository }}
          SOURCE_SHA: ${{ github.sha }}
          SOURCE_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          jq -n \
            --arg event_type "prod-image-published" \
            --arg environment "prod" \
            --arg image_key "crawler" \
            --arg digest "$DIGEST" \
            --arg source_repository "$SOURCE_REPOSITORY" \
            --arg source_sha "$SOURCE_SHA" \
            --arg source_run_url "$SOURCE_RUN_URL" \
            '{event_type: $event_type, client_payload: {environment: $environment, image_key: $image_key, digest: $digest, source_repository: $source_repository, source_sha: $source_sha, source_run_url: $source_run_url}}' \
          | gh api --method POST "repos/100-hours-a-week/KTB4-15th-GITOPS/dispatches" --input -

          {
            echo "### Crawler V3 Prod 이미지 승격 요청"
            echo "- Dev 검증 Commit: \`$DEV_SHA\`"
            echo "- Dev 검증 실행: $DEV_RUN_URL"
            echo "- 승격 Digest: \`$DIGEST\`"
            echo "- 영향 CronJob: \`price-crawler-apply\`, \`price-crawler-deliver\`"
            echo "- 반영 시점: GitOps 반영 뒤 다음 예약 Job 및 수동 Job부터"
            echo "- GitOps 이벤트: \`prod-image-published\`"
          } >> "$GITHUB_STEP_SUMMARY"
