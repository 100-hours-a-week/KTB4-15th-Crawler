# 가격 갱신 크롤러 dev CD (develop 브랜치 → V2 dev ECS Scheduled Task)
# - 크롤러는 ECS Service가 아니다. EventBridge Scheduler(매일 04:00 KST)가 family ARN으로
#   최신 ACTIVE revision을 RunTask한다. 그래서 배포 = revision 등록이다 (서비스 갱신 없음).
# - Task Definition은 CLOUD 레포 Terraform이 S3 템플릿(dev/v2/crawler.json)으로 관리한다.
#   이 워크플로는 템플릿의 __DIGEST__만 이번 이미지 digest로 바꿔 등록한다.
# - 이미지 태그는 커밋 SHA 7자리. ECR이 IMMUTABLE이라 같은 태그는 덮어쓰지 못하고 push가 실패한다.
# - GitHub Environment "develop" 변수: CRAWLER_BUILD_ROLE_ARN, CRAWLER_DEPLOY_ROLE_ARN
name: Price refresh dev CD

run-name: >-
  ${{ github.event_name == 'push'
      && format('Price refresh dev deploy - {0}', github.sha)
      || format('Price refresh dev rollback - {0}', inputs.image_tag) }}

on:
  # paths 필터를 두지 않는다. 필수 체크로 쓸 때 문서만 바뀐 커밋에서 실행되지 않으면
  # PR이 체크를 계속 기다리게 된다 (BE dev CD와 같은 규칙).
  push:
    branches: ["develop", "hotfix/**"]

  # 이미 ECR에 있는 이미지로 revision을 다시 등록할 때(롤백) 사용한다.
  workflow_dispatch:
    inputs:
      image_tag:
        description: "등록할 ECR 이미지 태그(7자리 SHA)"
        required: true
        type: string
      reason:
        description: "사유"
        required: true
        type: string

permissions: {}

concurrency:
  group: lookddak-price-refresh-dev
  cancel-in-progress: false

env:
  AWS_REGION: ap-northeast-2
  ECR_REPOSITORY: lookddak-dev-crawler
  TASK_FAMILY: lookddak-dev-v2-crawler
  TEMPLATE_KEY: dev/v2/crawler.json
  BUILD_CONTEXT: price-refresh-crawler

jobs:
  build-and-push:
    name: dev-build
    if: ${{ github.event_name == 'push' }}
    # Task Definition이 ARM64(Graviton)라 ARM 러너에서 네이티브로 빌드한다.
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    environment: develop
    permissions:
      id-token: write
      contents: read
    outputs:
      tag: ${{ steps.vars.outputs.tag }}
    steps:
      - name: Guard - develop / hotfix 브랜치 확인
        if: ${{ github.ref != 'refs/heads/develop' && !startsWith(github.ref, 'refs/heads/hotfix/') }}
        run: |
          echo "develop, hotfix/* 브랜치만 dev에 배포할 수 있습니다. 현재 ref: ${GITHUB_REF}"
          exit 1

      - name: Checkout
        uses: actions/checkout@v4

      - name: 이미지 태그 결정
        id: vars
        run: echo "tag=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: AWS 인증 - build role
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.CRAWLER_BUILD_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: ECR 로그인
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Buildx 준비
        uses: docker/setup-buildx-action@v3

      # Dockerfile의 test 단계가 단위 테스트를 실행한다. 실패하면 push되지 않는다.
      - name: 빌드 및 ECR push
        uses: docker/build-push-action@v6
        with:
          context: ${{ env.BUILD_CONTEXT }}
          file: ${{ env.BUILD_CONTEXT }}/Dockerfile
          platforms: linux/arm64
          push: true
          provenance: false
          tags: ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ steps.vars.outputs.tag }}
          cache-from: type=gha,scope=price-refresh
          cache-to: type=gha,mode=max,scope=price-refresh

  register:
    name: dev-register
    needs: build-and-push
    if: >-
      ${{
        always() &&
        (
          (github.event_name == 'push' && needs.build-and-push.result == 'success') ||
          github.event_name == 'workflow_dispatch'
        )
      }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: develop
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Guard - develop / hotfix 브랜치 확인
        if: ${{ github.ref != 'refs/heads/develop' && !startsWith(github.ref, 'refs/heads/hotfix/') }}
        run: |
          echo "develop, hotfix/* 브랜치의 워크플로만 dev에 배포할 수 있습니다. 현재 ref: ${GITHUB_REF}"
          exit 1

      - name: 태그와 사유 확정
        id: meta
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_TAG: ${{ inputs.image_tag }}
          INPUT_REASON: ${{ inputs.reason }}
          BUILT_TAG: ${{ needs.build-and-push.outputs.tag }}
        run: |
          if [[ "$EVENT_NAME" == "push" ]]; then
            TAG="$BUILT_TAG"
            REASON="${GITHUB_REF_NAME} push by ${GITHUB_ACTOR}"
          else
            TAG="$INPUT_TAG"
            REASON="$INPUT_REASON"
          fi
          if [[ ! "$TAG" =~ ^[0-9a-f]{7}$ ]]; then
            echo "태그 형식이 잘못되었습니다: '$TAG'"
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          {
            echo "reason<<__EOF__"
            echo "$REASON"
            echo "__EOF__"
          } >> "$GITHUB_OUTPUT"

      - name: AWS 인증 - deploy role
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.CRAWLER_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: 이미지 digest 조회
        id: image
        env:
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          DIGEST=$(aws ecr describe-images \
            --repository-name "$ECR_REPOSITORY" \
            --image-ids imageTag="$TAG" \
            --query 'imageDetails[0].imageDigest' --output text) \
          || { echo "ECR에 ${ECR_REPOSITORY}:${TAG} 이미지가 없습니다."; exit 1; }
          if [[ ! "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "digest 형식이 잘못되었습니다: '$DIGEST'"
            exit 1
          fi
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"

      # 버킷 이름에 계정 ID가 들어가므로 레포에 적지 않고 실행 시 만든다.
      - name: Task Definition 템플릿 다운로드
        id: template
        run: |
          ACCOUNT=$(aws sts get-caller-identity --query Account --output text)
          BUCKET="lookddak-ecs-taskdef-${ACCOUNT}-${AWS_REGION}"
          VERSION=$(aws s3api get-object \
            --bucket "$BUCKET" --key "$TEMPLATE_KEY" \
            "$RUNNER_TEMP/template.json" \
            --query VersionId --output text)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "repository_uri=${ACCOUNT}.dkr.ecr.${AWS_REGION}.amazonaws.com/${ECR_REPOSITORY}" >> "$GITHUB_OUTPUT"

      # __DIGEST__만 바꾸고, family·컨테이너 수·이미지 저장소가 예상과 같은지 확인한다.
      - name: digest 치환 및 검증
        env:
          DIGEST: ${{ steps.image.outputs.digest }}
          REPOSITORY_URI: ${{ steps.template.outputs.repository_uri }}
        run: |
          TEMPLATE="$RUNNER_TEMP/template.json"
          TASKDEF="$RUNNER_TEMP/taskdef.json"

          jq -e --arg family "$TASK_FAMILY" --arg image "${REPOSITORY_URI}@__DIGEST__" '
            .family == $family and
            (.containerDefinitions | length) == 1 and
            .containerDefinitions[0].image == $image
          ' "$TEMPLATE" > /dev/null \
          || { echo "::error::템플릿이 예상과 다릅니다 (family, 컨테이너 수, image 확인)"; exit 1; }

          jq --arg digest "$DIGEST" \
            '.containerDefinitions[0].image |= sub("@__DIGEST__$"; "@" + $digest)' \
            "$TEMPLATE" > "$TASKDEF"

          if grep -q '__DIGEST__' "$TASKDEF"; then
            echo "::error::치환 후에도 __DIGEST__가 남아 있습니다."
            exit 1
          fi
          jq -e --arg image "${REPOSITORY_URI}@${DIGEST}" \
            '.containerDefinitions[0].image == $image' "$TASKDEF" > /dev/null \
          || { echo "::error::치환 결과 image가 예상과 다릅니다."; exit 1; }

      # 등록만 한다. Scheduler가 다음 실행부터 이 revision(최신 ACTIVE)을 쓴다.
      - name: revision 등록
        id: register
        run: |
          ARN=$(aws ecs register-task-definition \
            --cli-input-json "file://$RUNNER_TEMP/taskdef.json" \
            --query 'taskDefinition.taskDefinitionArn' --output text)
          echo "arn=$ARN" >> "$GITHUB_OUTPUT"
          echo "등록: $ARN"

      # 실제로 실행될 revision(family의 최신 ACTIVE)이 방금 등록한 것이고 이미지가 이번 digest인지 확인한다.
      - name: 등록 결과 확인
        env:
          TAG: ${{ steps.meta.outputs.tag }}
          REASON: ${{ steps.meta.outputs.reason }}
          DIGEST: ${{ steps.image.outputs.digest }}
          REQUESTED: ${{ steps.register.outputs.arn }}
          TEMPLATE_VERSION: ${{ steps.template.outputs.version }}
        run: |
          read -r LATEST IMAGE STATUS < <(aws ecs describe-task-definition \
            --task-definition "$TASK_FAMILY" \
            --query 'taskDefinition.[taskDefinitionArn,containerDefinitions[0].image,status]' \
            --output text)
          {
            echo "### 가격 갱신 크롤러 dev revision 등록"
            echo "- 태그: \`${TAG}\` / 사유: ${REASON}"
            echo "- digest: \`${DIGEST}\`"
            echo "- 템플릿: \`${TEMPLATE_KEY}\` (S3 버전 \`${TEMPLATE_VERSION}\`)"
            echo "- 등록 revision: \`${REQUESTED}\`"
            echo "- 최신 ACTIVE: \`${LATEST}\` (${STATUS})"
          } >> "$GITHUB_STEP_SUMMARY"
          if [[ "$LATEST" != "$REQUESTED" || "$STATUS" != "ACTIVE" || "$IMAGE" != *"@${DIGEST}" ]]; then
            echo "::error::최신 ACTIVE revision이 방금 등록한 revision과 다릅니다."
            exit 1
          fi
          echo "다음 Scheduler 실행부터 ${REQUESTED##*/} 사용"
